<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Presupuesto</title>
</head>
<body>
<h1>Gestión de Presupuesto</h1>

<!-- PROYECTOS -->
<h2>Proyectos</h2>
<ul id="proyectos-list"></ul>

<h3>Agregar Proyecto</h3>
<input type="text" id="proyecto-nombre" placeholder="Nombre">
<input type="date" id="proyecto-inicio">
<input type="date" id="proyecto-fin">
<button onclick="agregarProyecto()">Agregar</button>

<!-- ETAPAS -->
<h2>Etapas</h2>
<ul id="etapas-list"></ul>

<h3>Agregar Etapa</h3>
<input type="text" id="etapa-fase" placeholder="Fase">
<input type="date" id="etapa-inicio">
<input type="date" id="etapa-fin">
<select id="etapa-proyecto"></select>
<button onclick="agregarEtapa()">Agregar</button>

<!-- PRESUPUESTOS -->
<h2>Presupuestos</h2>
<ul id="presupuestos-list"></ul>

<h3>Agregar Presupuesto</h3>
<input type="number" id="presupuesto-monto-total" placeholder="Monto Total">
<input type="number" id="presupuesto-monto-utilizado" placeholder="Monto Utilizado">
<select id="presupuesto-etapa"></select>
<button onclick="agregarPresupuesto()">Agregar</button>

<script>
    const apiBase = 'http://localhost:8080';

    // ---------- CARGAR DATOS ----------
    async function cargarProyectos() {
        const res = await fetch(`${apiBase}/proyectos`);
        const data = await res.json();
        const list = document.getElementById('proyectos-list');
        const select = document.getElementById('etapa-proyecto');
        list.innerHTML = '';
        select.innerHTML = '';
        if (data._embedded && data._embedded.proyectos) {
            data._embedded.proyectos.forEach(p => {
                list.innerHTML += `<li>${p.nombre} (${p.fechaInicio} - ${p.fechaFinalEstimada})</li>`;
                select.innerHTML += `<option value="${p._links.self.href}">${p.nombre}</option>`;
            });
        }
    }

    async function cargarEtapas() {
        const res = await fetch(`${apiBase}/etapas`);
        const data = await res.json();
        const list = document.getElementById('etapas-list');
        const select = document.getElementById('presupuesto-etapa');
        list.innerHTML = '';
        select.innerHTML = '';
        if (data._embedded && data._embedded.etapas) {
            data._embedded.etapas.forEach(e => {
                list.innerHTML += `<li>${e.fase} (${e.fechaInicio} - ${e.fechaFin}) - Proyecto: ${e.proyecto?.nombre || ''}</li>`;
                select.innerHTML += `<option value="${e._links.self.href}">${e.fase}</option>`;
            });
        }
    }

    async function cargarPresupuestos() {
        const res = await fetch(`${apiBase}/presupuestos`);
        const data = await res.json();
        const list = document.getElementById('presupuestos-list');
        list.innerHTML = '';
        if (data._embedded && data._embedded.presupuestos) {
            data._embedded.presupuestos.forEach(p => {
                list.innerHTML += `<li>Total: ${p.montoTotalEstimado}, Usado: ${p.montoUtilizado} - Etapa: ${p.etapa?.fase || ''}</li>`;
            });
        }
    }

    // ---------- AGREGAR DATOS ----------
    async function agregarProyecto() {
        const nombre = document.getElementById('proyecto-nombre').value;
        const inicio = document.getElementById('proyecto-inicio').value;
        const fin = document.getElementById('proyecto-fin').value;

        await fetch(`${apiBase}/proyectos`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({nombre, fechaInicio: inicio, fechaFinalEstimada: fin})
        });

        cargarProyectos();
    }

    async function agregarEtapa() {
        const fase = document.getElementById('etapa-fase').value;
        const inicio = document.getElementById('etapa-inicio').value;
        const fin = document.getElementById('etapa-fin').value;
        const proyectoUrl = document.getElementById('etapa-proyecto').value;

        await fetch(`${apiBase}/etapas`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                fase,
                fechaInicio: inicio,
                fechaFin: fin,
                proyecto: proyectoUrl // URI del proyecto
            })
        });

        cargarEtapas();
    }

    async function agregarPresupuesto() {
        const total = parseFloat(document.getElementById('presupuesto-monto-total').value);
        const usado = parseFloat(document.getElementById('presupuesto-monto-utilizado').value);
        const etapaUrl = document.getElementById('presupuesto-etapa').value;

        await fetch(`${apiBase}/presupuestos`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                montoTotalEstimado: total,
                montoUtilizado: usado,
                etapa: etapaUrl // URI de la etapa
            })
        });

        cargarPresupuestos();
    }


    cargarProyectos();
    cargarEtapas();
    cargarPresupuestos();
</script>
</body>
</html>

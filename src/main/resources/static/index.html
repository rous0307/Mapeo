<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestor de Presupuesto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h1 class="mb-4 text-center">Gestor de Presupuesto</h1>

    <!-- Formulario Proyecto -->
    <div class="mb-5 card p-4 shadow-sm">
        <h4>Crear / Editar Proyecto</h4>
        <form id="form-proyecto" class="row g-3">
            <input type="hidden" id="idProyecto">
            <div class="col-md-4">
                <input type="text" class="form-control" placeholder="Nombre Proyecto" id="nombreProyecto" required>
            </div>
            <div class="col-md-3">
                <input type="date" class="form-control" id="fechaInicioProyecto" required>
            </div>
            <div class="col-md-3">
                <input type="date" class="form-control" id="fechaFinProyecto" required>
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary w-100" type="submit">Guardar</button>
            </div>
        </form>
    </div>

    <!-- Lista Proyectos -->
    <div id="proyectos"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
